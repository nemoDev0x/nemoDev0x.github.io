---
layout: default
---
<div class="post-header">
  <div class="post-breadcrumb">
    <a href="{{ '/' | relative_url }}">~/home</a>
    <span>/</span>
    <a href="{{ '/tags/#' | append: page.categories[0] | relative_url }}">{{ page.categories[0] }}</a>
    <span>/</span>{{ page.title }}
  </div>
  <h1 class="post-page-title">{{ page.title }}</h1>
  <div class="post-meta">
    <span data-label="DATE">{{ page.date | date: "%d.%m.%Y" }}</span>
    {% if page.categories[0] %}<span data-label="CAT">{{ page.categories[0] }}</span>{% endif %}
  </div>
  {% if page.tags %}
  <div class="post-tags">
    {% for tag in page.tags %}<a href="{{ '/tags/#' | append: tag | relative_url }}" class="tag">{{ tag }}</a>{% endfor %}
  </div>
  {% endif %}
</div>
<article class="post-content">{{ content }}</article>
